<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Tumit Hasan — MERN Stack Developer</title>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D98BA"/>
      <stop offset="50%" stop-color="#12121f"/>
      <stop offset="100%" stop-color="#0D98BA"/>
      <animate attributeName="x1" values="0%;20%;0%" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;80%;100%" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0D98BA" stop-opacity="0.28"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <clipPath id="typeClip">
      <rect x="385" y="157" width="0" height="34">
        <animate attributeName="width" from="0" to="430" dur="1.6s" begin="1.0s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <g fill="#FFFFFF" opacity="0.05" font-family="'Courier New', Consolas, monospace" font-size="13">
    <text x="42" y="38">$ npm run build</text>
    <text x="42" y="60">✓ compiled successfully</text>
    <text x="42" y="82">build target: production</text>
    <text x="860" y="222">$ git push origin main</text>
    <text x="860" y="244">status: online</text>
    <text x="860" y="266">deploy: 100% complete</text>
  </g>

  <path d="M0,255 C220,225 380,285 620,260 C860,235 980,275 1200,250 L1200,300 L0,300 Z" fill="url(#waveGrad)"/>

  <g filter="url(#softShadow)">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0,16" to="0,0" dur="1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      <text x="600" y="130" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="66" font-weight="800" letter-spacing="4" fill="#F5F7FA">TUMIT HASAN</text>
    </g>
  </g>

  <g>
    <text x="385" y="180" clip-path="url(#typeClip)" font-family="'Courier New', Consolas, monospace" font-size="26" font-weight="700" letter-spacing="5" fill="#00D4FF">MERN STACK DEVELOPER</text>
    <rect x="815" y="157" width="4" height="30" fill="#00D4FF" opacity="0">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="520" y="200" width="0" height="3" rx="1.5" fill="#0D98BA">
    <animate attributeName="width" from="0" to="160" dur="0.6s" begin="2.6s" fill="freeze"/>
    <animate attributeName="x" from="600" to="520" dur="0.6s" begin="2.6s" fill="freeze"/>
  </rect>

  <g font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0,10" to="0,0" dur="0.5s" begin="2.9s" fill="freeze"/>
      <rect x="61" y="248" width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#0D98BA" stroke-width="1"/>
      <circle cx="88" cy="265" r="10" fill="#47A248"/>
      <text x="88" y="268.5" font-size="9" text-anchor="middle" fill="#FFFFFF">Mo</text>
      <text x="150" y="270" text-anchor="middle" fill="#E6F7FB">MongoDB</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.02s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0,10" to="0,0" dur="0.5s" begin="3.02s" fill="freeze"/>
      <rect x="243" y="248" width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#0D98BA" stroke-width="1"/>
      <circle cx="270" cy="265" r="10" fill="#F5F7FA"/>
      <text x="270" y="268.5" font-size="9" text-anchor="middle" fill="#12121f">Ex</text>
      <text x="335" y="270" text-anchor="middle" fill="#E6F7FB">Express</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.14s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0,10" to="0,0" dur="0.5s" begin="3.14s" fill="freeze"/>
      <rect x="425" y="248" width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#0D98BA" stroke-width="1"/>
      <g stroke="#61DAFB" fill="none" stroke-width="1.5">
        <ellipse cx="452" cy="265" rx="10" ry="4.2"/>
        <ellipse cx="452" cy="265" rx="10" ry="4.2" transform="rotate(60 452 265)"/>
        <ellipse cx="452" cy="265" rx="10" ry="4.2" transform="rotate(120 452 265)"/>
      </g>
      <circle cx="452" cy="265" r="2" fill="#61DAFB"/>
      <text x="521" y="270" text-anchor="middle" fill="#E6F7FB">React</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.26s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0,10" to="0,0" dur="0.5s" begin="3.26s" fill="freeze"/>
      <rect x="607" y="248" width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#0D98BA" stroke-width="1"/>
      <circle cx="634" cy="265" r="10" fill="#339933"/>
      <text x="634" y="268.5" font-size="9" text-anchor="middle" fill="#FFFFFF">Nd</text>
      <text x="702" y="270" text-anchor="middle" fill="#E6F7FB">Node.js</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.38s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0,10" to="0,0" dur="0.5s" begin="3.38s" fill="freeze"/>
      <rect x="789" y="248" width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#0D98BA" stroke-width="1"/>
      <circle cx="816" cy="265" r="10" fill="#FFCA28"/>
      <text x="816" y="268.5" font-size="9" text-anchor="middle" fill="#12121f">Fb</text>
      <text x="885" y="270" text-anchor="middle" fill="#E6F7FB">Firebase</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0,10" to="0,0" dur="0.5s" begin="3.5s" fill="freeze"/>
      <rect x="971" y="248" width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#0D98BA" stroke-width="1"/>
      <circle cx="998" cy="265" r="10" fill="#F05032"/>
      <text x="998" y="268.5" font-size="9" text-anchor="middle" fill="#FFFFFF">Gt</text>
      <text x="1062" y="270" text-anchor="middle" fill="#E6F7FB">Git</text>
    </g>
  </g>
</svg>
