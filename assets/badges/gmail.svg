<svg width="190" height="48" viewBox="0 0 190 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="186" height="44" rx="22" fill="#0D98BA" filter="url(#glow)" opacity="0.18">
    <animate attributeName="opacity" values="0.12;0.38;0.12" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.05s" fill="freeze"/>
    <rect x="2" y="2" width="186" height="44" rx="22" fill="#12121f" stroke="#0D98BA" stroke-width="1.4"/>
    <circle cx="34" cy="24" r="13" fill="#EA4335"/>
    <text x="34" y="28.5" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#FFFFFF">M</text>
    <text x="118" y="29" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#E6F7FB">Gmail</text>
  </g>
</svg>
