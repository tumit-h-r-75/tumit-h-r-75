<svg xmlns="http://www.w3.org/2000/svg" width="820" height="64" viewBox="0 0 820 64" role="img" aria-labelledby="ths05-t">
<title id="ths05-t">05 — Skills</title>
<style>
@keyframes ths05-rise{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes ths05-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ths05-run{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(598px);opacity:0}}
@keyframes ths05-sweep{0%{transform:translateX(0)}55%,100%{transform:translateX(1120px)}}
.ths05-in{animation:ths05-rise .7s cubic-bezier(.2,.7,.2,1) .1s both}
.ths05-line{stroke-dasharray:1;animation:ths05-draw 1.2s cubic-bezier(.6,0,.2,1) .4s both}
.ths05-run{animation:ths05-run 4.5s ease-in-out 1.6s infinite}
.ths05-sweep{animation:ths05-sweep 8s ease-in-out 1s infinite}
@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}.motion{display:none}}
</style>
<defs>
  <clipPath id="ths05-clip"><rect width="820" height="64" rx="14"/></clipPath>
  <linearGradient id="ths05-bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
  <radialGradient id="ths05-glow"><stop offset="0" stop-color="#701A3D" stop-opacity=".6"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></radialGradient>
  <pattern id="ths05-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#F8F0F3" stroke-opacity=".04" stroke-width=".6"/></pattern>
  <linearGradient id="ths05-ln" gradientUnits="userSpaceOnUse" x1="188" y1="0" x2="790" y2="0"><stop offset="0" stop-color="#C77B9B"/><stop offset="1" stop-color="#C77B9B" stop-opacity=".1"/></linearGradient>
  <linearGradient id="ths05-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8F0F3" stop-opacity="0"/><stop offset=".5" stop-color="#F8F0F3" stop-opacity=".06"/><stop offset="1" stop-color="#F8F0F3" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#ths05-clip)">
  <rect width="820" height="64" fill="url(#ths05-bg)"/>
  <rect width="820" height="64" fill="url(#ths05-grid)"/>
  <circle cx="36" cy="32" r="90" fill="url(#ths05-glow)"/>
  <g class="a" transform="skewX(-18)"><rect class="ths05-sweep" x="-260" y="0" width="160" height="64" fill="url(#ths05-sheen)"/></g>
  <rect x="12" y="10" width="44" height="44" rx="12" fill="#10070C" stroke="#701A3D" stroke-width="1.2"/>
  <g transform="translate(22 20) scale(1.0)" fill="none" stroke="#E5B5C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/><path d="M13.5 4.5l-3 15"/></g>
  <g class="a"><g class="ths05-in">
    <text x="78" y="26" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="11" letter-spacing="3" fill="#C77B9B">05<tspan fill="#B8949F" dx="8">/  TOOLKIT</tspan></text>
    <text x="77" y="50" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#F8F0F3">Skills</text>
  </g></g>
  <g class="a">
    <path class="ths05-line" pathLength="1" d="M188 41H790" stroke="url(#ths05-ln)" stroke-width="1.2" fill="none"/>
    <rect x="786" y="37" width="8" height="8" transform="rotate(45 790 41)" fill="#C77B9B"/>
    <circle class="ths05-run motion" cx="188" cy="41" r="2.5" fill="#F8F0F3"/>
  </g>
</g>
<rect x=".6" y=".6" width="818.8" height="62.8" rx="13.4" fill="none" stroke="#451126" stroke-width="1.2"/>
</svg>
