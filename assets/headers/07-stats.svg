<svg xmlns="http://www.w3.org/2000/svg" width="820" height="64" viewBox="0 0 820 64" role="img" aria-labelledby="ths07-t">
<title id="ths07-t">07 — GitHub Stats</title>
<style>
@keyframes ths07-rise{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes ths07-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ths07-run{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(511px);opacity:0}}
@keyframes ths07-sweep{0%{transform:translateX(0)}55%,100%{transform:translateX(1120px)}}
.ths07-in{animation:ths07-rise .7s cubic-bezier(.2,.7,.2,1) .1s both}
.ths07-line{stroke-dasharray:1;animation:ths07-draw 1.2s cubic-bezier(.6,0,.2,1) .4s both}
.ths07-run{animation:ths07-run 4.5s ease-in-out 1.6s infinite}
.ths07-sweep{animation:ths07-sweep 8s ease-in-out 1s infinite}
@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}.motion{display:none}}
</style>
<defs>
  <clipPath id="ths07-clip"><rect width="820" height="64" rx="14"/></clipPath>
  <linearGradient id="ths07-bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
  <radialGradient id="ths07-glow"><stop offset="0" stop-color="#701A3D" stop-opacity=".6"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></radialGradient>
  <pattern id="ths07-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#F8F0F3" stroke-opacity=".04" stroke-width=".6"/></pattern>
  <linearGradient id="ths07-ln" gradientUnits="userSpaceOnUse" x1="275" y1="0" x2="790" y2="0"><stop offset="0" stop-color="#C77B9B"/><stop offset="1" stop-color="#C77B9B" stop-opacity=".1"/></linearGradient>
  <linearGradient id="ths07-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8F0F3" stop-opacity="0"/><stop offset=".5" stop-color="#F8F0F3" stop-opacity=".06"/><stop offset="1" stop-color="#F8F0F3" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#ths07-clip)">
  <rect width="820" height="64" fill="url(#ths07-bg)"/>
  <rect width="820" height="64" fill="url(#ths07-grid)"/>
  <circle cx="36" cy="32" r="90" fill="url(#ths07-glow)"/>
  <g class="a" transform="skewX(-18)"><rect class="ths07-sweep" x="-260" y="0" width="160" height="64" fill="url(#ths07-sheen)"/></g>
  <rect x="12" y="10" width="44" height="44" rx="12" fill="#10070C" stroke="#701A3D" stroke-width="1.2"/>
  <g transform="translate(22 20) scale(1.0)" fill="none" stroke="#E5B5C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20.5h18"/><path d="M6.5 16.5v-5"/><path d="M10.8 16.5V6"/><path d="M15.1 16.5V9"/><path d="M19.4 16.5V4"/></g>
  <g class="a"><g class="ths07-in">
    <text x="78" y="26" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="11" letter-spacing="3" fill="#C77B9B">07<tspan fill="#B8949F" dx="8">/  ANALYTICS</tspan></text>
    <text x="77" y="50" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#F8F0F3">GitHub Stats</text>
  </g></g>
  <g class="a">
    <path class="ths07-line" pathLength="1" d="M275 41H790" stroke="url(#ths07-ln)" stroke-width="1.2" fill="none"/>
    <rect x="786" y="37" width="8" height="8" transform="rotate(45 790 41)" fill="#C77B9B"/>
    <circle class="ths07-run motion" cx="275" cy="41" r="2.5" fill="#F8F0F3"/>
  </g>
</g>
<rect x=".6" y=".6" width="818.8" height="62.8" rx="13.4" fill="none" stroke="#451126" stroke-width="1.2"/>
</svg>
