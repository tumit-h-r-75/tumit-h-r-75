<svg xmlns="http://www.w3.org/2000/svg" width="820" height="64" viewBox="0 0 820 64" role="img" aria-labelledby="ths08-t">
<title id="ths08-t">08 — Let's Connect</title>
<style>
@keyframes ths08-rise{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes ths08-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ths08-run{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(497px);opacity:0}}
@keyframes ths08-sweep{0%{transform:translateX(0)}55%,100%{transform:translateX(1120px)}}
.ths08-in{animation:ths08-rise .7s cubic-bezier(.2,.7,.2,1) .1s both}
.ths08-line{stroke-dasharray:1;animation:ths08-draw 1.2s cubic-bezier(.6,0,.2,1) .4s both}
.ths08-run{animation:ths08-run 4.5s ease-in-out 1.6s infinite}
.ths08-sweep{animation:ths08-sweep 8s ease-in-out 1s infinite}
@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}.motion{display:none}}
</style>
<defs>
  <clipPath id="ths08-clip"><rect width="820" height="64" rx="14"/></clipPath>
  <linearGradient id="ths08-bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
  <radialGradient id="ths08-glow"><stop offset="0" stop-color="#701A3D" stop-opacity=".6"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></radialGradient>
  <pattern id="ths08-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#F8F0F3" stroke-opacity=".04" stroke-width=".6"/></pattern>
  <linearGradient id="ths08-ln" gradientUnits="userSpaceOnUse" x1="289" y1="0" x2="790" y2="0"><stop offset="0" stop-color="#C77B9B"/><stop offset="1" stop-color="#C77B9B" stop-opacity=".1"/></linearGradient>
  <linearGradient id="ths08-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8F0F3" stop-opacity="0"/><stop offset=".5" stop-color="#F8F0F3" stop-opacity=".06"/><stop offset="1" stop-color="#F8F0F3" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#ths08-clip)">
  <rect width="820" height="64" fill="url(#ths08-bg)"/>
  <rect width="820" height="64" fill="url(#ths08-grid)"/>
  <circle cx="36" cy="32" r="90" fill="url(#ths08-glow)"/>
  <g class="a" transform="skewX(-18)"><rect class="ths08-sweep" x="-260" y="0" width="160" height="64" fill="url(#ths08-sheen)"/></g>
  <rect x="12" y="10" width="44" height="44" rx="12" fill="#10070C" stroke="#701A3D" stroke-width="1.2"/>
  <g transform="translate(22 20) scale(1.0)" fill="none" stroke="#E5B5C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10.5 13.5"/><path d="M21 3l-6.5 18-4-7.5-7.5-4z"/></g>
  <g class="a"><g class="ths08-in">
    <text x="78" y="26" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="11" letter-spacing="3" fill="#C77B9B">08<tspan fill="#B8949F" dx="8">/  CONNECT</tspan></text>
    <text x="77" y="50" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#F8F0F3">Let's Connect</text>
  </g></g>
  <g class="a">
    <path class="ths08-line" pathLength="1" d="M289 41H790" stroke="url(#ths08-ln)" stroke-width="1.2" fill="none"/>
    <rect x="786" y="37" width="8" height="8" transform="rotate(45 790 41)" fill="#C77B9B"/>
    <circle class="ths08-run motion" cx="289" cy="41" r="2.5" fill="#F8F0F3"/>
  </g>
</g>
<rect x=".6" y=".6" width="818.8" height="62.8" rx="13.4" fill="none" stroke="#451126" stroke-width="1.2"/>
</svg>
