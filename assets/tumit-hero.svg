<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="thh-title thh-desc">
<title id="thh-title">Tumit Hasan — Full Stack Developer</title>
<desc id="thh-desc">Burgundy animated banner. Tumit Hasan, Full Stack Developer working with MERN, Next.js and WordPress. Based in Jashore, Bangladesh.</desc>
<style>
@keyframes thh-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes thh-fade{from{opacity:0}to{opacity:1}}
@keyframes thh-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes thh-spin{to{transform:rotate(360deg)}}
@keyframes thh-spin-rev{to{transform:rotate(-360deg)}}
@keyframes thh-drift-a{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,26px)}}
@keyframes thh-drift-b{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-22px)}}
@keyframes thh-sweep{0%{transform:translateX(0)}60%,100%{transform:translateX(1700px)}}
@keyframes thh-pulse{0%,100%{opacity:.35}50%{opacity:1}}
.thh-r1{animation:thh-rise .9s cubic-bezier(.2,.7,.2,1) .1s both}
.thh-r2{animation:thh-rise .9s cubic-bezier(.2,.7,.2,1) .35s both}
.thh-r3{animation:thh-rise .9s cubic-bezier(.2,.7,.2,1) .6s both}
.thh-r4{animation:thh-fade 1.2s ease 1s both}
.thh-draw{stroke-dasharray:1;animation:thh-draw 1.6s cubic-bezier(.6,0,.2,1) .5s both}
.thh-wave{stroke-dasharray:1;animation:thh-draw 2.6s cubic-bezier(.5,0,.2,1) .2s both}
.thh-spin{transform-origin:975px 178px;animation:thh-spin 28s linear infinite}
.thh-spin2{transform-origin:975px 178px;animation:thh-spin-rev 46s linear infinite}
.thh-ticks{transform-origin:975px 178px;animation:thh-spin 120s linear infinite}
.thh-da{animation:thh-drift-a 14s ease-in-out infinite}
.thh-db{animation:thh-drift-b 17s ease-in-out infinite}
.thh-sweep{animation:thh-sweep 9s ease-in-out 2.2s infinite}
.thh-pulse{animation:thh-pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}.motion{display:none}}
</style>
<defs>
  <clipPath id="thh-clip"><rect width="1200" height="360" rx="22"/></clipPath>
  <linearGradient id="thh-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10070C"/><stop offset=".55" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
  </linearGradient>
  <radialGradient id="thh-glow-a"><stop offset="0" stop-color="#701A3D" stop-opacity=".75"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></radialGradient>
  <radialGradient id="thh-glow-b"><stop offset="0" stop-color="#451126" stop-opacity=".9"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
  <radialGradient id="thh-glow-c"><stop offset="0" stop-color="#C77B9B" stop-opacity=".22"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/></radialGradient>
  <pattern id="thh-grid-s" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#F8F0F3" stroke-opacity=".045" stroke-width=".7"/></pattern>
  <pattern id="thh-grid-l" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#E5B5C7" stroke-opacity=".08" stroke-width=".8"/></pattern>
  <radialGradient id="thh-fade-g" cx=".72" cy=".45" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="thh-fade"><rect width="1200" height="360" fill="url(#thh-fade-g)"/></mask>
  <linearGradient id="thh-line" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="600" y2="0">
    <stop offset="0" stop-color="#E5B5C7"/><stop offset=".55" stop-color="#C77B9B"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="thh-wave-g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#701A3D" stop-opacity="0"/><stop offset=".3" stop-color="#C77B9B"/><stop offset=".7" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="thh-sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F8F0F3" stop-opacity="0"/><stop offset=".5" stop-color="#F8F0F3" stop-opacity=".07"/><stop offset="1" stop-color="#F8F0F3" stop-opacity="0"/>
  </linearGradient>
  <filter id="thh-blur" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="360"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="thh-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <path id="thh-orbit" d="M779,178 a196,64 0 1,0 392,0 a196,64 0 1,0 -392,0"/>
  <path id="thh-wave-p" d="M-10,332 C150,306 270,350 430,326 S720,298 880,320 S1090,346 1210,308"/>
</defs>
<g clip-path="url(#thh-clip)">
  <rect width="1200" height="360" fill="url(#thh-bg)"/>
  <g class="a">
    <circle class="thh-da" cx="170" cy="40" r="260" fill="url(#thh-glow-a)" filter="url(#thh-soft)"/>
    <circle class="thh-db" cx="1040" cy="330" r="300" fill="url(#thh-glow-b)" filter="url(#thh-soft)"/>
    <circle class="thh-da" cx="700" cy="-30" r="200" fill="url(#thh-glow-c)"/>
  </g>
  <g mask="url(#thh-fade)">
    <rect width="1200" height="360" fill="url(#thh-grid-s)"/>
    <rect width="1200" height="360" fill="url(#thh-grid-l)"/>
  </g>
  <g class="a" transform="skewX(-18)"><rect class="thh-sweep" x="-420" y="0" width="260" height="360" fill="url(#thh-sheen)"/></g>

  <!-- orbital geometry -->
  <g class="a" fill="none" stroke-linecap="round">
    <line x1="735" y1="178" x2="1215" y2="178" stroke="#E5B5C7" stroke-opacity=".12" stroke-dasharray="2 7"/>
    <line x1="975" y1="18" x2="975" y2="342" stroke="#E5B5C7" stroke-opacity=".12" stroke-dasharray="2 7"/>
    <circle cx="975" cy="178" r="155" stroke="#C77B9B" stroke-opacity=".16"/>
    <circle cx="975" cy="178" r="116" stroke="#C77B9B" stroke-opacity=".3" stroke-dasharray="2 6"/>
    <circle cx="975" cy="178" r="70" stroke="#C77B9B" stroke-opacity=".45"/>
    <use href="#thh-orbit" stroke="#E5B5C7" stroke-opacity=".22" transform="rotate(-16 975 178)"/>
    <g class="thh-ticks" stroke="#E5B5C7" stroke-opacity=".35" stroke-width="1"><line x1="1053.0" y1="178.0" x2="1061.0" y2="178.0"/><line x1="1054.3" y1="188.4" x2="1058.3" y2="189.0"/><line x1="1052.3" y1="198.7" x2="1056.1" y2="199.7"/><line x1="1048.9" y1="208.6" x2="1052.6" y2="210.1"/><line x1="1042.5" y1="217.0" x2="1049.5" y2="221.0"/><line x1="1038.5" y1="226.7" x2="1041.6" y2="229.1"/><line x1="1031.6" y1="234.6" x2="1034.4" y2="237.4"/><line x1="1023.7" y1="241.5" x2="1026.1" y2="244.6"/><line x1="1014.0" y1="245.5" x2="1018.0" y2="252.5"/><line x1="1005.6" y1="251.9" x2="1007.1" y2="255.6"/><line x1="995.7" y1="255.3" x2="996.7" y2="259.1"/><line x1="985.4" y1="257.3" x2="986.0" y2="261.3"/><line x1="975.0" y1="256.0" x2="975.0" y2="264.0"/><line x1="964.6" y1="257.3" x2="964.0" y2="261.3"/><line x1="954.3" y1="255.3" x2="953.3" y2="259.1"/><line x1="944.4" y1="251.9" x2="942.9" y2="255.6"/><line x1="936.0" y1="245.5" x2="932.0" y2="252.5"/><line x1="926.3" y1="241.5" x2="923.9" y2="244.6"/><line x1="918.4" y1="234.6" x2="915.6" y2="237.4"/><line x1="911.5" y1="226.7" x2="908.4" y2="229.1"/><line x1="907.5" y1="217.0" x2="900.5" y2="221.0"/><line x1="901.1" y1="208.6" x2="897.4" y2="210.1"/><line x1="897.7" y1="198.7" x2="893.9" y2="199.7"/><line x1="895.7" y1="188.4" x2="891.7" y2="189.0"/><line x1="897.0" y1="178.0" x2="889.0" y2="178.0"/><line x1="895.7" y1="167.6" x2="891.7" y2="167.0"/><line x1="897.7" y1="157.3" x2="893.9" y2="156.3"/><line x1="901.1" y1="147.4" x2="897.4" y2="145.9"/><line x1="907.5" y1="139.0" x2="900.5" y2="135.0"/><line x1="911.5" y1="129.3" x2="908.4" y2="126.9"/><line x1="918.4" y1="121.4" x2="915.6" y2="118.6"/><line x1="926.3" y1="114.5" x2="923.9" y2="111.4"/><line x1="936.0" y1="110.5" x2="932.0" y2="103.5"/><line x1="944.4" y1="104.1" x2="942.9" y2="100.4"/><line x1="954.3" y1="100.7" x2="953.3" y2="96.9"/><line x1="964.6" y1="98.7" x2="964.0" y2="94.7"/><line x1="975.0" y1="100.0" x2="975.0" y2="92.0"/><line x1="985.4" y1="98.7" x2="986.0" y2="94.7"/><line x1="995.7" y1="100.7" x2="996.7" y2="96.9"/><line x1="1005.6" y1="104.1" x2="1007.1" y2="100.4"/><line x1="1014.0" y1="110.5" x2="1018.0" y2="103.5"/><line x1="1023.7" y1="114.5" x2="1026.1" y2="111.4"/><line x1="1031.6" y1="121.4" x2="1034.4" y2="118.6"/><line x1="1038.5" y1="129.3" x2="1041.6" y2="126.9"/><line x1="1042.5" y1="139.0" x2="1049.5" y2="135.0"/><line x1="1048.9" y1="147.4" x2="1052.6" y2="145.9"/><line x1="1052.3" y1="157.3" x2="1056.1" y2="156.3"/><line x1="1054.3" y1="167.6" x2="1058.3" y2="167.0"/></g>
    <g class="thh-spin"><circle cx="1091" cy="178" r="4" fill="#E5B5C7" stroke="none"/><circle cx="1091" cy="178" r="9" fill="#C77B9B" fill-opacity=".25" stroke="none"/></g>
    <g class="thh-spin2"><circle cx="975" cy="23" r="3" fill="#C77B9B" stroke="none"/></g>
    <g transform="rotate(-16 975 178)" class="motion">
      <circle r="3.5" fill="#F8F0F3" stroke="none"><animateMotion dur="11s" repeatCount="indefinite"><mpath href="#thh-orbit"/></animateMotion></circle>
    </g>
  </g>
  <circle cx="975" cy="178" r="46" fill="#190B12" stroke="#701A3D" stroke-width="1.5"/>
  <circle cx="975" cy="178" r="40" fill="none" stroke="#C77B9B" stroke-opacity=".35"/>
  <text x="975" y="190" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="700" fill="#E5B5C7" letter-spacing="1">TH</text>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="11.5" fill="#B8949F" letter-spacing="2" text-anchor="end">
    <text x="1160" y="68">23.17°N · 89.21°E</text>
    <text x="1160" y="86" fill-opacity=".7">UTC+06:00</text>
  </g>

  <!-- corner crop marks -->
  <g stroke="#C77B9B" stroke-opacity=".55" stroke-width="1.5" fill="none">
    <path d="M26 46V26H46"/><path d="M1174 46V26H1154"/><path d="M26 314V334H46"/><path d="M1174 314V334H1154"/>
  </g>

  <!-- identity -->
  <g class="a">
    <g class="thh-r1">
      <path d="M72 88H104" stroke="#C77B9B" stroke-width="2" stroke-linecap="round"/>
      <text x="116" y="93" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" letter-spacing="5" fill="#C77B9B">HELLO, I'M</text>
    </g>
    <text class="thh-r2" x="68" y="174" font-family="Georgia,'Times New Roman',serif" font-size="84" font-weight="700" fill="#F8F0F3" letter-spacing=".5">Tumit Hasan</text>
    <path class="thh-draw" pathLength="1" d="M72 198H600" stroke="url(#thh-line)" stroke-width="7" stroke-linecap="round" filter="url(#thh-blur)" opacity=".75"/>
    <path class="thh-draw" pathLength="1" d="M72 198H600" stroke="url(#thh-line)" stroke-width="2.5" stroke-linecap="round"/>
    <text class="thh-r3" x="70" y="242" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#E5B5C7">Full Stack Developer<tspan font-size="21" font-weight="400" fill="#F8F0F3" fill-opacity=".72" dx="14">/  MERN · Next.js · WordPress</tspan></text>
    <g class="thh-r4" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" letter-spacing="2" fill="#B8949F"><rect x="80" y="287" width="6" height="6" transform="rotate(45 83 290)" fill="#C77B9B"/><text x="96" y="296">JASHORE, BANGLADESH</text><rect x="346" y="287" width="6" height="6" transform="rotate(45 349 290)" fill="#C77B9B"/><text x="362" y="296">1+ YR AT EXPROVIA</text><rect x="584" y="287" width="6" height="6" transform="rotate(45 587 290)" fill="#C77B9B"/><text x="600" y="296">OPEN TO COLLABORATE</text></g>
    <circle class="thh-pulse" cx="587" cy="290" r="9" fill="#C77B9B" fill-opacity=".35"/>
  </g>

  <!-- signal path -->
  <g class="a" fill="none">
    <path class="thh-wave" pathLength="1" d="M-10,344 C170,326 300,358 470,340 S760,316 900,336 S1100,356 1210,330" stroke="#C77B9B" stroke-opacity=".25" stroke-width="1"/>
    <path class="thh-wave" pathLength="1" d="M-10,332 C150,306 270,350 430,326 S720,298 880,320 S1090,346 1210,308" stroke="url(#thh-wave-g)" stroke-width="1.6"/>
    <circle r="3" fill="#F8F0F3" class="motion"><animateMotion dur="7s" begin="2.8s" repeatCount="indefinite"><mpath href="#thh-wave-p"/></animateMotion></circle>
  </g>
</g>
<rect x=".75" y=".75" width="1198.5" height="358.5" rx="21.5" fill="none" stroke="#451126" stroke-width="1.5"/>
</svg>
